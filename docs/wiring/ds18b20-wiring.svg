<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#222">Water temperature probe (DS18B20) wiring</text>
  <text x="20" y="52" fill="#555">Pi 3B+ header, end furthest from the USB ports. Odd pins are the inner row, even pins the board edge.</text>

  <!-- header -->
  <rect x="40" y="80" width="150" height="250" rx="6" fill="#1d3b1d"/>
  <text x="115" y="345" text-anchor="middle" fill="#555">40-pin header (pins 1-14)</text>
  <g font-size="11" fill="#fff" text-anchor="middle">
    <!-- odd column x=85, even x=145; rows 34px apart from y=100 -->
    <circle cx="85" cy="100" r="11" fill="#e03a3a" stroke="#fff" stroke-width="2"/><text x="85" y="104">1</text>
    <circle cx="145" cy="100" r="11" fill="#666"/><text x="145" y="104">2</text>
    <circle cx="85" cy="134" r="11" fill="#666"/><text x="85" y="138">3</text>
    <circle cx="145" cy="134" r="11" fill="#666"/><text x="145" y="138">4</text>
    <circle cx="85" cy="168" r="11" fill="#666"/><text x="85" y="172">5</text>
    <circle cx="145" cy="168" r="11" fill="#666"/><text x="145" y="172">6</text>
    <circle cx="85" cy="202" r="11" fill="#e0b400" stroke="#fff" stroke-width="2"/><text x="85" y="206" fill="#000">7</text>
    <circle cx="145" cy="202" r="11" fill="#666"/><text x="145" y="206">8</text>
    <circle cx="85" cy="236" r="11" fill="#111" stroke="#fff" stroke-width="2"/><text x="85" y="240">9</text>
    <circle cx="145" cy="236" r="11" fill="#666"/><text x="145" y="240">10</text>
    <circle cx="85" cy="270" r="11" fill="#3a7bd5"/><text x="85" y="274">11</text>
    <circle cx="145" cy="270" r="11" fill="#666"/><text x="145" y="274">12</text>
    <circle cx="85" cy="304" r="11" fill="#666"/><text x="85" y="308">13</text>
    <circle cx="145" cy="304" r="11" fill="#666"/><text x="145" y="308">14</text>
  </g>
  <rect x="73" y="88" width="24" height="24" fill="none" stroke="#fff" stroke-width="1.5"/>
  <text x="30" y="95" text-anchor="end" font-size="11" fill="#555">pin 1</text>
  <text x="30" y="108" text-anchor="end" font-size="11" fill="#555">(square)</text>

  <!-- pin labels -->
  <text x="205" y="104" fill="#e03a3a" font-weight="bold">1  = 3.3 V</text>
  <text x="205" y="206" fill="#b38f00" font-weight="bold">7  = GPIO4 (1-Wire data)</text>
  <text x="205" y="240" fill="#111" font-weight="bold">9  = GND</text>
  <text x="205" y="274" fill="#3a7bd5">11 = GPIO17 (DHT11 already here, leave it)</text>
  <text x="205" y="138" fill="#999">2, 4 = 5 V: never use for the probe</text>

  <!-- probe -->
  <rect x="610" y="120" width="120" height="44" rx="22" fill="#9aa3ad"/>
  <text x="670" y="147" text-anchor="middle" fill="#fff" font-weight="bold">DS18B20</text>
  <text x="670" y="182" text-anchor="middle" fill="#555" font-size="12">steel probe, in the tank</text>
  <!-- wires from probe -->
  <path d="M610 132 C 560 132, 520 100, 470 100" stroke="#e03a3a" stroke-width="5" fill="none"/>
  <path d="M610 142 C 540 142, 520 202, 470 202" stroke="#e0b400" stroke-width="5" fill="none"/>
  <path d="M610 152 C 560 152, 540 236, 470 236" stroke="#111" stroke-width="5" fill="none"/>
  <text x="540" y="96" fill="#e03a3a" font-size="12">red</text>
  <text x="555" y="182" fill="#b38f00" font-size="12">yellow (or white)</text>
  <text x="555" y="226" fill="#111" font-size="12">black</text>
  <circle cx="470" cy="100" r="5" fill="#e03a3a"/>
  <circle cx="470" cy="202" r="5" fill="#e0b400"/>
  <circle cx="470" cy="236" r="5" fill="#111"/>

  <!-- resistor between 3.3V and data -->
  <line x1="470" y1="100" x2="470" y2="125" stroke="#444" stroke-width="2"/>
  <rect x="460" y="125" width="20" height="50" rx="4" fill="#d9b38c" stroke="#444"/>
  <rect x="460" y="135" width="20" height="5" fill="#d4a017"/><rect x="460" y="145" width="20" height="5" fill="#7a1fa2"/><rect x="460" y="155" width="20" height="5" fill="#c0392b"/>
  <line x1="470" y1="175" x2="470" y2="202" stroke="#444" stroke-width="2"/>
  <text x="400" y="150" text-anchor="end" fill="#444" font-weight="bold">4.7 kΩ</text>
  <text x="400" y="166" text-anchor="end" fill="#666" font-size="12">between 3.3 V and data</text>

  <!-- dashed jumpers to header -->
  <path d="M465 100 L 97 100" stroke="#e03a3a" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.5"/>
  <path d="M465 202 L 97 202" stroke="#e0b400" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.6"/>
  <path d="M465 236 L 97 236" stroke="#111" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.5"/>

  <!-- notes -->
  <rect x="20" y="370" width="720" height="86" rx="8" fill="#f4f6f8"/>
  <text x="34" y="393" fill="#222">• Shut the Pi down and unplug it before wiring.</text>
  <text x="34" y="414" fill="#222">• If pin 1 or 9 is already used by the DHT11, use pin 17 (also 3.3 V) and pin 14, 20 or 25 (also GND).</text>
  <text x="34" y="435" fill="#222">• Probes sold with a small adapter board already include the 4.7 kΩ resistor: wire VCC / DAT / GND to 1 / 7 / 9.</text>
  <text x="34" y="451" fill="#666" font-size="12">Resistor bands: yellow-violet-red(-gold) = 4.7 kΩ.</text>
</svg>
