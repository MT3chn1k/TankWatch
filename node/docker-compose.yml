# TankWatch collector. Normally set up by ./setup.sh, which writes tankwatch.yaml and, if your sensors need
# hardware access, docker-compose.override.yml. To start or restart by hand: docker compose up -d --build
services:
  node:
    build: .
    image: tankwatch-node
    container_name: tankwatch-node
    restart: unless-stopped
    network_mode: host                    # discovery scans your home network, and the collector takes the Pi's name
    # Locked down: it runs as the Pi user who ran setup.sh (setup.sh writes the exact user, and the gpio group if a
    # DHT needs it, into docker-compose.override.yml), with every Linux capability removed (so no capturing network
    # traffic despite host networking), no way to gain privileges, and a read-only filesystem.
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    env_file:
      - path: .env                        # optional: the older INFLUX_* / TANKWATCH_NODE settings
        required: false
    volumes:
      - ./tankwatch.yaml:/config/tankwatch.yaml   # read-write: a moved hub's new address is saved here
      # node_health reports disk use for the disk this folder is on (the Pi's main disk). Only this folder is
      # shared, read-only: never mount the host's whole filesystem, which would expose SSH keys and password hashes.
      - .:/host:ro
