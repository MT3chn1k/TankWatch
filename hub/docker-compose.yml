# TankWatch hub: InfluxDB stores the readings, Grafana shows them, the admin page manages collectors.
# First time: ./setup.sh  (creates .env with passwords and tokens, starts everything, prints join codes)
services:
  influxdb:
    image: influxdb:2.7.11
    restart: unless-stopped
    ports: ["${INFLUX_PORT:-8086}:8086", "8087:8087"]   # 8087 is the discovery beacon (always 8087), sharing this address
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?run ./setup.sh first}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-tankwatch}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-sensors}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-0}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:?run ./setup.sh first}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      retries: 12

  grafana:
    image: grafana/grafana-oss:11.6.0
    restart: unless-stopped
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on:
      influxdb: {condition: service_healthy}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run ./setup.sh first}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sensors.json
      INFLUX_ORG: ${INFLUX_ORG:-tankwatch}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-sensors}
      INFLUX_READ_TOKEN: ${INFLUX_READ_TOKEN:-}

  # Discovery beacon: answers "is there a TankWatch hub here?" on port 8087 so collectors and displays can
  # find the hub without anyone typing its address. Serves only hub/beacon/tankwatch.json (no secrets).
  beacon:
    image: busybox:1.36.1
    restart: unless-stopped
    network_mode: "service:influxdb"   # same address as InfluxDB, so "where the beacon is" = "where the data goes"
    volumes:
      - ./beacon:/www:ro
    command: ["httpd", "-f", "-p", "8087", "-h", "/www"]

  # Admin page: http://<hub>:8088 (user admin, ADMIN_PASSWORD from .env). Collector status, what each one reports,
  # adding a sensor Pi (it shows the join codes, so it's password protected) and a status sign config builder.
  # It only reads: InfluxDB queries use the read-only token. NODE_WRITE_TOKEN is here only to build the join code.
  admin:
    build: ../admin
    image: tankwatch-admin
    restart: unless-stopped
    ports: ["${ADMIN_PORT:-8088}:8088"]
    depends_on:
      influxdb: {condition: service_healthy}
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      INFLUX_ORG: ${INFLUX_ORG:-tankwatch}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-sensors}
      INFLUX_READ_TOKEN: ${INFLUX_READ_TOKEN:-}
      NODE_WRITE_TOKEN: ${NODE_WRITE_TOKEN:-}
      HUB_ID: ${HUB_ID:-}
      HUB_NAME: ${HUB_NAME:-}
      HUB_ADDRESS: ${HUB_ADDRESS:-}
      HUB_DETECTED_ADDRESS: ${HUB_DETECTED_ADDRESS:-}
      INFLUX_PUBLIC_PORT: ${INFLUX_PORT:-8086}       # the ports other devices use, for join codes and links
      GRAFANA_PUBLIC_PORT: ${GRAFANA_PORT:-3000}

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
